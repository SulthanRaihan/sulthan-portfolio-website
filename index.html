<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061a2b">
  <title>Sulthan Raihan — portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@700&family=Instrument+Serif:ital@1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;800&family=Silkscreen&display=block" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="about.css">
  <link rel="stylesheet" href="works.css">
  <link rel="stylesheet" href="journey.css">
  <link rel="stylesheet" href="outro.css">
  <link rel="stylesheet" href="os.css">
  <link rel="stylesheet" href="sayhi.css">
  <link rel="stylesheet" href="research.css">
  <link rel="stylesheet" href="music.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <!-- 1. boot loader -->
  <div class="loader" id="loader" aria-live="polite">
    <div class="loader-glow" aria-hidden="true"></div>
    <div class="loader-top"><span id="loader-status">Starting…</span><span>portfolio.exe</span></div>
    <div class="loader-count"><b id="loader-num">0</b>%</div>
  </div>

  <!-- 2. the 3D room (monitor, desk, lamp) -->
  <canvas id="scene" aria-hidden="true"></canvas>
  <h1 class="sr-only" id="sr-title"></h1>
  <p class="sr-only">Drag the cable on the monitor into the globe, or press Enter, to start.</p>

  <header class="top">
    <a class="brand" href="#" id="home" aria-label="Back to start">Sulthan<br>Raihan</a>
    <div class="who"><b id="who-name"></b><span id="who-role"></span></div>
    <button class="snd" id="snd" type="button" aria-pressed="true">
      <span class="snd-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>sound
    </button>
  </header>
  <p class="hint" id="hint">Scroll to look around ↓</p>

  <!-- scroll length that pulls the camera back into the room -->
  <main class="track" id="track"></main>

  <!-- 3. the rest of the portfolio -->
  <div class="content" id="content">
    <!-- (01) About: split headline on the grid + the CV printer on the right -->
    <section class="about" id="about" aria-labelledby="about-title">
      <div class="about-hero"><div class="about-in">
        <header class="sw-head sw-grid">
          <p class="sw-label"><span>(01)</span> <span id="about-label"></span></p>
          <p class="sw-label sw-r" id="about-role"></p>
        </header>
        <h2 class="sw-big sw-grid" id="about-title" data-split></h2>
        <figure class="cv" id="cv">
          <div class="cv-stage" id="cv-stage" role="button" tabindex="0" aria-label="Print and download my CV"></div>
          <figcaption class="cv-ui"><p class="cv-status" id="cv-status" aria-live="polite"></p></figcaption>
        </figure>
      </div></div>
    </section>

    <!-- (02) Portrait: framed photo, the name on its sides, eras underneath — scrubbed by the scroll (portrait.js) -->
    <section class="pt" id="portrait" aria-labelledby="pt-title">
      <h2 class="sr-only pt-sr" id="pt-title"></h2>
      <div class="pt-stage">
        <canvas aria-hidden="true"></canvas>
        <svg class="pt-outline" aria-hidden="true"><path></path></svg>
        <div class="pt-word pt-l" aria-hidden="true"><span></span></div>
        <div class="pt-word pt-r" aria-hidden="true"><span></span></div>
        <ol class="pt-eras" aria-hidden="true"></ol>
      </div>
    </section>

    <!-- (03) Journey: education & experience — a big canvas of giant rows the scroll pans across (journey.js) -->
    <section class="jr" id="journey" aria-label="Education and experience">
      <div class="jr-stage"><p class="sw-label jr-label"><span>(03)</span> Journey</p><div class="jr-canvas"></div></div>
    </section>

    <!-- (04) Work: a scroll-driven tunnel of cards, one chapter per category (works.js) -->
    <section class="works" id="work" aria-labelledby="work-title">
      <div class="works-stage">
        <canvas class="works-gl" aria-hidden="true"></canvas>
        <p class="sw-label works-note"><span>(04)</span> Work</p>
        <div class="works-copy">
          <h2 class="works-title" id="work-title">Websites &amp; Apps</h2>
          <p class="works-sub"></p>
          <a class="works-btn" href="work.html">View all <span aria-hidden="true">→</span></a>
        </div>
        <nav class="works-dots" aria-label="Work categories"></nav>
      </div>
    </section>
  </div>

  <!-- (05) Back at the desk: the 3D room shows through; Aiko walks the desk; look inside the computer or unplug it (outro.js, os.js) -->
  <section class="outro" id="outro" aria-label="Back at the desk">
    <div class="ou-ui">
      <div class="ou-spots"></div>
    </div>
    <p class="ou-tip" hidden></p>
    <p class="ou-bubble" aria-live="polite"></p>
    <div class="ac" hidden role="dialog" aria-label="Chat with Aiko">
      <header class="ac-head">
        <span class="ac-ava"><img class="ac-av" alt=""><i aria-hidden="true"></i></span>
        <div><b>Aiko <span class="ac-badge">study buddy</span></b><span class="ac-status">online · replies instantly</span></div>
        <button class="ac-new" type="button" aria-label="Start over" title="Start over">↺</button>
        <button class="ac-x" type="button" aria-label="Close chat">×</button>
      </header>
      <ol class="ac-log" aria-live="polite"></ol>
      <div class="ac-sugg" aria-label="Suggested questions"></div>
      <form class="ac-form"><input placeholder="Ask Aiko anything…" aria-label="Ask Aiko" autocomplete="off" maxlength="200">
        <button aria-label="Send" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg></button></form>
    </div>
  </section>

  <!-- (06) Say hi: hidden until the old computer is unplugged (sayhi.js) -->
  <section class="hi" id="sayhi" hidden aria-label="Say hi"></section>

  <script type="module" src="main.js"></script>
  <script type="module" src="about.js"></script>
  <script type="module" src="portrait.js"></script>
  <script type="module" src="journey.js"></script>
  <script type="module" src="works.js"></script>
  <script type="module" src="sayhi.js"></script>
  <script type="module" src="outro.js"></script>
  <script type="module" src="cursor.js"></script>
</body>
</html>
